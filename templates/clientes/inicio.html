{% extends 'base.html' %}
{% block title %}Chino Barber · Inicio{% endblock %}

{% block content %}
<section class="max-w-6xl mx-auto px-4 py-24 text-center">
    <h1 class="text-5xl md:text-6xl font-display font-bold text-marca mb-6">Chino Barber</h1>
    <p class="text-lg text-gray-300 max-w-2xl mx-auto mb-10">
        Estilo, precisión y tradición. Reservá tu turno online y elegí tu barbero.

    <a href="#reservas" class="inline-block px-8 py-3 bg-marca text-black font-semibold rounded hover:bg-marca-dark transition">
